<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
</head>
<body>
<nav>
  <a href="/">Home</a>
</nav>
<main>
  <h1>Sign in</h1>
  <form id="signin">
    <label>Email <input id="signin-email" type="email" autocomplete="username"></label>
    <label>Password <input id="signin-password" type="password" autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
  <p id="signin-result"></p>
</main>
<script type="module" src="/assets/app-login.js"></script>
</body>
</html>
